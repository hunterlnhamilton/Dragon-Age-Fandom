<!-- =============================================================
     header.html
     Sticky site header: brand, main nav, search, theme + menu toggles.
     Placeholders in {{double braces}} are filled by build.sh.
     Mark the current page's nav link with aria-current="page".
     ============================================================= -->
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="site-header__inner">

    <button class="icon-btn menu-toggle" type="button"
            aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h10"/>
      </svg>
    </button>

    <a class="brand" href="{{base_url}}/">
      <!-- crescent moon + star mark -->
      <svg class="brand__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M20.5 4.5A11.5 11.5 0 1 0 27.5 21 9 9 0 0 1 20.5 4.5Z" fill="currentColor" opacity=".9"/>
        <path d="M24 6l.9 2.1L27 9l-2.1.9L24 12l-.9-2.1L21 9l2.1-.9L24 6Z" fill="currentColor"/>
      </svg>
      <span class="brand__name">{{site_name}}</span>
    </a>

    <nav class="site-nav" aria-label="Main">
      <ul class="site-nav__list">
        <li><a class="site-nav__link" href="{{base_url}}/">Home</a></li>
        <li><a class="site-nav__link" href="{{base_url}}/Lore/">Lore</a></li>
        <li><a class="site-nav__link" href="{{base_url}}/Lore/Canon/Characters/">Characters</a></li>
        <li><a class="site-nav__link" href="{{base_url}}/Lore/Canon/Timeline/">Timeline</a></li>
        <li><a class="site-nav__link" href="{{base_url}}/Reference/">Reference</a></li>
      </ul>
    </nav>

    <form class="site-search" role="search" action="{{base_url}}/search/" method="get">
      <label class="visually-hidden" for="site-search-input">Search the archive</label>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="site-search-input" type="search" name="q" placeholder="Search the archive…" autocomplete="off">
    </form>

    <div class="header-actions">
      <a class="icon-btn search-toggle" href="{{base_url}}/search/" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
      </a>

      <button class="icon-btn theme-toggle" type="button" aria-label="Switch light or dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>
        </svg>
      </button>
    </div>

  </div>
</header>
