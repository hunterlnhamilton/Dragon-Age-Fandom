# Kiln configuration file
# CLI flags in build.sh override these values.
# Default mode mirrors the vault (folder pages, backlinks, graph, search).
# The Fade look is added on top by build.sh (see assets/css/thedas.css).

theme: "rose-pine"   # base theme; thedas.css overrides its colors
mode: default
